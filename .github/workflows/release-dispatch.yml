# Temporary twin of release.yml, dispatchable manually because the release
# tag could not be pushed from the remote session. Safe to delete after use.
name: Release plugin (manual dispatch)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. 1.0.8)"
        required: true
      sha:
        description: "Commit SHA to release"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Stage release assets
        run: |
          cp release/remarkable-sync/main.js main.js
          cp release/remarkable-sync/manifest.json manifest.json
          cp release/remarkable-sync/styles.css styles.css

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ inputs.sha }}
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
